suite: deployment
templates:
  - deployment.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders one Deployment for the all role by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_RUNNER_RUNTIME_CLASS
          any: true
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritique
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: all
      - equal:
          path: spec.template.metadata.labels["kritique.perfectra1n.github.io/hooks"]
          value: "true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: all
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/perfectra1n/kritique:\d+\.\d+\.\d+$

  - it: gates the liveness and readiness probes on a startup probe, which can be turned off
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: renders no startup probe when it is set to null
    set:
      startupProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: wires the three database secrets and the runner settings for a worker-capable role
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kritique-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DATABASE_OWNER_URL
            valueFrom:
              secretKeyRef:
                name: kritique-postgres-credentials
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_RUNNER_DATABASE_SECRET
            value: kritique-postgres-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_RUNNER_SERVICE_ACCOUNT
            value: RELEASE-NAME-kritique-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EXECUTOR
            value: kubernetes

  - it: mounts the config and every secretMount read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/kritique
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: bot
            mountPath: /var/run/secrets/kritique/bot
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: providers
            secret:
              secretName: kritique-providers

  - it: leaves the embedder out until a model is set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EMBED_MODEL
            value: voyageai/voyage-code-4
          any: true

  - it: sets the embedder from an existing secret
    set:
      embedding.model: voyageai/voyage-code-4
      embedding.existingSecret: kritique-providers
      embedding.existingSecretKey: openrouter-api-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EMBED_MODEL
            value: voyageai/voyage-code-4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EMBED_API_KEY
            valueFrom:
              secretKeyRef:
                name: kritique-providers
                key: openrouter-api-key

  - it: fails when a model is set without a key
    set:
      embedding.model: voyageai/voyage-code-4
    asserts:
      - failedTemplate:
          errorPattern: embedding.model is set but no key

  - it: renders the split topology with an ingest and a worker Deployment
    set:
      roles.all.enabled: false
      roles.ingest.enabled: true
      roles.worker.enabled: true
      roles.worker.resources:
        limits:
          memory: 2Gi
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritique-ingest
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritique-worker
        documentIndex: 1
      # Ingest never sees the owner DSN or the runner settings.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EXECUTOR
            value: kubernetes
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EXECUTOR
            value: kubernetes
        documentIndex: 1
      # The worker has no http port and is not selected by the webhook Service.
      - notExists:
          path: spec.template.metadata.labels["kritique.perfectra1n.github.io/hooks"]
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
        documentIndex: 1

  - it: refuses all together with a split role
    set:
      roles.worker.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: single-process topology

  - it: refuses a worker-capable role without the owner secret
    set:
      database.owner.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: database.owner.existingSecret is required

  - it: prefers the digest over the tag when set
    set:
      image.digest: sha256:deadbeef
      image.tag: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/perfectra1n/kritique@sha256:deadbeef
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_RUNNER_IMAGE
            value: ghcr.io/perfectra1n/kritique@sha256:deadbeef

  - it: hands the worker a runner RuntimeClass only when one is set
    set:
      runner.runtimeClassName: gvisor
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_RUNNER_RUNTIME_CLASS
            value: gvisor

  - it: renders a web-only Deployment with the dashboard env and port, and no http/gateway port
    set:
      roles.all.enabled: false
      roles.web.enabled: true
      web.url: https://dash.example.com
      web.port: 9090
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritique-web
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: web
      - equal:
          path: spec.template.metadata.labels["kritique.perfectra1n.github.io/web"]
          value: "true"
      - notExists:
          path: spec.template.metadata.labels["kritique.perfectra1n.github.io/hooks"]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_WEB_URL
            value: https://dash.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_WEB_ADDR
            value: ":9090"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: web
            containerPort: 9090
            protocol: TCP
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
          any: true
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: gateway
          any: true
      # The web role never gets the owner DSN or the runner/gateway settings.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_EXECUTOR
            value: kubernetes
          any: true

  - it: hands the all role the dashboard env and port when web.url is set
    set:
      web.url: https://dash.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_WEB_URL
            value: https://dash.example.com
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: web
            containerPort: 8083
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
          any: true

  - it: leaves the dashboard env and port out of the all role when web.url is unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_WEB_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: web
          any: true

  - it: fails when roles.web.enabled is true without web.url
    set:
      roles.web.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: web.url is required when roles.web.enabled is true

  - it: fails when web.url is not an http(s) URL
    set:
      web.url: ftp://dash.example.com
    asserts:
      - failedTemplate:
          errorPattern: web.url must be an http\(s\) URL

  - it: wires the dashboard key and old-keys secrets into every non-runner role
    set:
      roles.all.enabled: false
      roles.ingest.enabled: true
      roles.worker.enabled: true
      roles.web.enabled: true
      web.url: https://dash.example.com
      dashboard.keySecret.name: kritique-dashboard-key
      dashboard.keySecret.key: key
      dashboard.oldKeysSecret.name: kritique-dashboard-old-keys
      dashboard.oldKeysSecret.key: old-keys
    asserts:
      - hasDocuments:
          count: 3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_KEY
            valueFrom:
              secretKeyRef:
                name: kritique-dashboard-key
                key: key
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_OLD_KEYS
            valueFrom:
              secretKeyRef:
                name: kritique-dashboard-old-keys
                key: old-keys
        documentIndex: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_KEY
            valueFrom:
              secretKeyRef:
                name: kritique-dashboard-key
                key: key
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_KEY
            valueFrom:
              secretKeyRef:
                name: kritique-dashboard-key
                key: key
        documentIndex: 2

  - it: leaves the dashboard key env out when no secret is configured
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_KEY
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIQUE_DASHBOARD_OLD_KEYS
          any: true
