---
# Chart values for scripts/smoke.sh: kritique serve as the chart deploys it,
# two replicas so the owner DSN, the leader lock and a standby are all
# exercised, against the CloudNativePG cluster the script creates. The
# image is set by the script; the Secrets are the ones it generates.
replicas: 2
database:
  owner:
    existingSecret: kritique-postgres-credentials
  app:
    existingSecret: kritique-postgres-app
  runner:
    existingSecret: kritique-postgres-runner
config:
  webUrl: http://kritique.kritique.svc:8080
  # The app below is not a real GitHub App, so the backstop poll stays off.
  pollInterval: 0s
  authAdminPassword:
    valueFrom:
      secretKeyRef: { name: kritique-smoke-auth, key: password }
configFile:
  apps:
    github:
      accounts: [home-operations]
      clientId: Iv1.smoke
      privateKey: { env: GITHUB_APP_PRIVATE_KEY }
      webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
env:
  GITHUB_APP_PRIVATE_KEY:
    valueFrom:
      secretKeyRef: { name: kritique-smoke-bot, key: private-key.pem }
  GITHUB_APP_WEBHOOK_SECRET:
    valueFrom:
      secretKeyRef: { name: kritique-smoke-bot, key: webhook-secret }
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 512Mi }
